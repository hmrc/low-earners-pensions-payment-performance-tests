# Configure here your journeys. A journey is a sequence of requests at a certain load.

journeys {
  LEPP-Frontend-journey = {
    description = "Low Earners Pensions Payment - Frontend only"
    load = 1
    skip-if = [
      LEPP-Backend-PTA-journey
    ]
    parts = [
      low-earners-pensions-payment-journey
    ]
  }

  LEPP-Backend-PTA-journey = {
    description = "Low Earners Pensions Payment - Backend PTA only"
    load = 1
    skip-if = [
      LEPP-Frontend-journey
    ]
    parts = [
      lepp-backend-pta-journey
    ]
  }
}